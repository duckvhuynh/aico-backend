name: AICO-008 Alpha Operating Policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Activate exact npm runtime
        run: >-
          npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund
          && test "$(npm --version)" = "11.6.2"
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Check AICO-008 package formatting
        run: >-
          npx prettier --check
          .github/workflows/aico-008-alpha-policy.yml
          docs/contracts/schemas/alpha-operating-policy.v1.schema.json
          docs/delivery/AICO_008_EVIDENCE.md
          docs/policies/alpha-operating-policy-v1.json
          docs/policies/alpha-operating-policy-v1.md
          scripts/prove-aico-008-policy-fail-closed.mjs
          scripts/validate-aico-008-policy.mjs
          scripts/verify-aico-008-alpha-policy.mjs
      - name: Validate closed policy and deliberate failure registry
        run: node scripts/verify-aico-008-alpha-policy.mjs
